<svg viewBox="0 0 980 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#475569"/>
    </marker>
    <marker id="arrowLoop" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="560" fill="#ffffff"/>
  <text x="40" y="46" font-size="24" font-weight="700" fill="#0f172a">Agentic SDLC Delivery Assistant</text>
  <text x="40" y="72" font-size="14" fill="#64748b">Sequential multi-agent pipeline · human-in-the-loop gates · task-optimized model routing</text>

  <!-- Input -->
  <rect x="40" y="120" width="150" height="70" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="115" y="150" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Feature request</text>
  <text x="115" y="170" font-size="12" fill="#64748b" text-anchor="middle">(free text)</text>

  <!-- Agent 1 -->
  <rect x="230" y="110" width="160" height="90" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="310" y="138" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">1 · Requirements</text>
  <text x="310" y="156" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">Analyst</text>
  <text x="310" y="182" font-size="11" fill="#2563eb" text-anchor="middle">Sonnet · MID</text>

  <!-- Agent 2 -->
  <rect x="430" y="110" width="160" height="90" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="510" y="145" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">2 · Story Writer</text>
  <text x="510" y="182" font-size="11" fill="#2563eb" text-anchor="middle">Haiku · LOW</text>

  <!-- Agent 3 -->
  <rect x="630" y="110" width="160" height="90" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="710" y="145" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">3 · Test Designer</text>
  <text x="710" y="182" font-size="11" fill="#2563eb" text-anchor="middle">Sonnet · MID</text>

  <!-- Agent 4 -->
  <rect x="820" y="110" width="140" height="90" rx="10" fill="#fef2f2" stroke="#ef4444"/>
  <text x="890" y="138" font-size="14" font-weight="700" fill="#991b1b" text-anchor="middle">4 · QA</text>
  <text x="890" y="156" font-size="14" font-weight="700" fill="#991b1b" text-anchor="middle">Verifier</text>
  <text x="890" y="182" font-size="11" fill="#dc2626" text-anchor="middle">Opus · HIGH</text>

  <!-- flow arrows -->
  <line x1="190" y1="155" x2="228" y2="155" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="390" y1="155" x2="428" y2="155" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="155" x2="628" y2="155" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="790" y1="155" x2="818" y2="155" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- HITL gates -->
  <g>
    <rect x="250" y="250" width="120" height="46" rx="23" fill="#ecfdf5" stroke="#10b981"/>
    <text x="310" y="272" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">HITL Gate 1</text>
    <text x="310" y="288" font-size="10" fill="#059669" text-anchor="middle">approve requirement</text>
    <line x1="310" y1="200" x2="310" y2="248" stroke="#10b981" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  </g>
  <g>
    <rect x="450" y="250" width="120" height="46" rx="23" fill="#ecfdf5" stroke="#10b981"/>
    <text x="510" y="272" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">HITL Gate 2</text>
    <text x="510" y="288" font-size="10" fill="#059669" text-anchor="middle">approve stories</text>
    <line x1="510" y1="200" x2="510" y2="248" stroke="#10b981" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  </g>
  <g>
    <rect x="830" y="250" width="120" height="46" rx="23" fill="#ecfdf5" stroke="#10b981"/>
    <text x="890" y="272" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">HITL Gate 3</text>
    <text x="890" y="288" font-size="10" fill="#059669" text-anchor="middle">final sign-off</text>
    <line x1="890" y1="200" x2="890" y2="248" stroke="#10b981" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  </g>

  <!-- feedback loop from verifier back to story writer -->
  <path d="M 820 175 C 700 240, 620 240, 515 205" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowLoop)"/>
  <text x="655" y="232" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">high-severity gaps → stories or tests (max 2)</text>

  <!-- Output -->
  <rect x="380" y="350" width="220" height="60" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="490" y="378" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Delivery Spec</text>
  <text x="490" y="396" font-size="11" fill="#64748b" text-anchor="middle">requirement · stories · tests · gap report</text>
  <line x1="890" y1="296" x2="890" y2="380" stroke="#475569" stroke-width="2"/>
  <line x1="890" y1="380" x2="602" y2="380" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- shared state note -->
  <rect x="40" y="350" width="300" height="60" rx="10" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="55" y="374" font-size="12" font-weight="700" fill="#92400e">Shared state: typed Delivery Spec object</text>
  <text x="55" y="393" font-size="11" fill="#b45309">agents read/write fields — no free-form chat handoff</text>

  <!-- legend -->
  <text x="40" y="470" font-size="13" font-weight="700" fill="#0f172a">Legend</text>
  <rect x="40" y="482" width="16" height="16" rx="3" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="64" y="495" font-size="12" fill="#334155">Agent (LLM node)</text>
  <rect x="200" y="482" width="16" height="16" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="224" y="495" font-size="12" fill="#334155">Human-in-the-loop gate</text>
  <line x1="410" y1="490" x2="446" y2="490" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="454" y="495" font-size="12" fill="#334155">Conditional feedback loop</text>
  <rect x="640" y="482" width="16" height="16" rx="3" fill="#fef2f2" stroke="#ef4444"/>
  <text x="664" y="495" font-size="12" fill="#334155">Verification step (premium model)</text>

  <text x="40" y="534" font-size="11" fill="#94a3b8">Model budget concentrates on verification (step 4); structural steps use cheaper tiers.</text>
</svg>
