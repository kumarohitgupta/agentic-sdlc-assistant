name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live_eval:
        description: "Also run the evaluation cases against Claude (needs the ANTHROPIC_API_KEY repo secret)"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Offline demo
        run: sdlc-assistant demo --auto-approve
      - name: Workflow JSON is current
        run: |
          python n8n/build_workflow.py --check

  live-eval:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_eval }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - run: sdlc-assistant eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: runs/
